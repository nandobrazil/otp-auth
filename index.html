<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>OTP Authenticator - FrInfo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- defs de ícones (Boxicons, MIT) reaproveitados via <use> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="icon-shield" viewBox="0 0 24 24">
          <path d="M21.881 5.223a.496.496 0 0 0-.747-.412c-.672.392-1.718.898-2.643.898-.421 0-.849-.064-1.289-.198a5.712 5.712 0 0 1-.808-.309c-1.338-.639-2.567-1.767-3.696-2.889a1.008 1.008 0 0 0-.698-.29 1.008 1.008 0 0 0-.698.29c-1.129 1.122-2.358 2.25-3.696 2.889h-.001a5.655 5.655 0 0 1-.807.309c-.44.134-.869.198-1.289.198-.925 0-1.971-.507-2.643-.898a.496.496 0 0 0-.747.412c-.061 1.538-.077 4.84.688 7.444 1.399 4.763 4.48 7.976 8.91 9.292l.14.041.14-.014V22v-.014H12l.143.014.14-.041c4.43-1.316 7.511-4.529 8.91-9.292.765-2.604.748-5.906.688-7.444z"/>
        </symbol>
        <symbol id="icon-show" viewBox="0 0 24 24">
          <path d="M12 9a3.02 3.02 0 0 0-3 3c0 1.642 1.358 3 3 3 1.641 0 3-1.358 3-3 0-1.641-1.359-3-3-3z"/>
          <path d="M12 5c-7.633 0-9.927 6.617-9.948 6.684L1.946 12l.105.316C2.073 12.383 4.367 19 12 19s9.927-6.617 9.948-6.684l.106-.316-.105-.316C21.927 11.617 19.633 5 12 5zm0 12c-5.351 0-7.424-3.846-7.926-5C4.578 10.842 6.652 7 12 7c5.351 0 7.424 3.846 7.926 5-.504 1.158-2.578 5-7.926 5z"/>
        </symbol>
        <symbol id="icon-hide" viewBox="0 0 24 24">
          <path d="M12 19c.946 0 1.81-.103 2.598-.281l-1.757-1.757c-.273.021-.55.038-.841.038-5.351 0-7.424-3.846-7.926-5a8.642 8.642 0 0 1 1.508-2.297L4.184 8.305c-1.538 1.667-2.121 3.346-2.132 3.379a.994.994 0 0 0 0 .633C2.073 12.383 4.367 19 12 19zm0-14c-1.837 0-3.346.396-4.604.981L3.707 2.293 2.293 3.707l18 18 1.414-1.414-3.319-3.319c2.614-1.951 3.547-4.615 3.561-4.657a.994.994 0 0 0 0-.633C21.927 11.617 19.633 5 12 5zm4.972 10.558-2.28-2.28c.19-.39.308-.819.308-1.278 0-1.641-1.359-3-3-3-.459 0-.888.118-1.277.309L8.915 7.501A9.26 9.26 0 0 1 12 7c5.351 0 7.424 3.846 7.926 5-.302.692-1.166 2.342-2.954 3.558z"/>
        </symbol>
        <symbol id="icon-copy" viewBox="0 0 24 24">
          <path d="M20 2H10c-1.103 0-2 .897-2 2v4H4c-1.103 0-2 .897-2 2v10c0 1.103.897 2 2 2h10c1.103 0 2-.897 2-2v-4h4c1.103 0 2-.897 2-2V4c0-1.103-.897-2-2-2zM4 20V10h10l.002 10H4zm16-6h-4v-4c0-1.103-.897-2-2-2h-4V4h10v10z"/>
        </symbol>
        <symbol id="icon-check" viewBox="0 0 24 24">
          <path d="m10 15.586-3.293-3.293-1.414 1.414L10 18.414l9.707-9.707-1.414-1.414z"/>
        </symbol>
        <symbol id="icon-bookmark" viewBox="0 0 24 24">
          <path d="M18 2H6c-1.103 0-2 .897-2 2v18l8-4.572L20 22V4c0-1.103-.897-2-2-2zm0 16.553-6-3.428-6 3.428V4h12v14.553z"/>
        </symbol>
      </defs>
    </svg>

    <div class="aurora" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>
    <div class="spotlight" aria-hidden="true"></div>

    <main class="card">
      <header class="card-header">
        <svg class="icon icon-brand" aria-hidden="true"><use href="#icon-shield"/></svg>
        <h1>OTP Authenticator</h1>
      </header>

      <div class="key-field">
        <input
          type="password"
          id="key"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          onchange="startOTP()"
          placeholder="Cole sua chave Base32"
        />
        <button
          type="button"
          class="icon-btn toggle-visibility"
          id="toggleVisibility"
          onclick="toggleKeyVisibility()"
          aria-label="Mostrar chave"
          title="Mostrar/ocultar chave"
        ><svg class="icon" id="toggleIcon" aria-hidden="true"><use href="#icon-show"/></svg></button>
      </div>
      <p id="invalid">Chave inválida</p>

      <div id="otp-container">
        <div class="progress-container">
          <svg width="128" height="128" viewBox="0 0 128 128" class="ring">
            <circle cx="64" cy="64" r="56" class="progress-background"></circle>
            <circle cx="64" cy="64" r="56" class="progress-circle" id="progressCircle"></circle>
          </svg>
          <button type="button" class="otp-code" id="otp" onclick="copyOTP()" title="Clique para copiar"></button>
        </div>

        <button type="button" class="copy-btn" onclick="copyOTP()">
          <svg class="icon" id="copyIcon" aria-hidden="true"><use href="#icon-copy"/></svg>
          <span id="copyLabel">Copiar código</span>
        </button>

        <p class="hint">
          <svg class="icon icon-hint" aria-hidden="true"><use href="#icon-bookmark"/></svg>
          Pressione <kbd>Ctrl</kbd>+<kbd>D</kbd> (ou <kbd>Cmd</kbd>+<kbd>D</kbd> no Mac) para
          salvar como favorito — funciona como atalho direto pra esse código, com a chave já
          configurada. Dê um nome ao favorito pra identificar depois.
        </p>
      </div>
    </main>
    <span class="footer">v0.3.0 · by oconde.dev</span>
    <script src="script.js"></script>
  </body>
</html>
