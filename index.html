<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Authenticator - FrInfo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>OTP Authenticator</h2>
        <input type="password" id="key" onkeyup="startOTP()" placeholder="Insira a chave OTP Base32">
        <span id="invalid">Chave inválida</span>
            
        <div id="otp-container">
          <div class="progress-container">
              <svg width="100" height="100">
                  <circle cx="50" cy="50" r="40" class="progress-background"></circle>
                  <circle cx="50" cy="50" r="40" class="progress-circle" id="progressCircle"></circle>
              </svg>
          </div>
          <div class="otp-display">
            <span id="otp" onclick="copyOTP()"></span>
          </div>
          <span id="copied">Copiado para a área de transferência</span>
      </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
