<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Authenticator - FrInfo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>OTP Authenticator</h2>
      <input
        type="password"
        id="key"
        onchange="startOTP()"
        placeholder="Enter Base32 OTP key"
      />
      <span id="invalid">Invalid key</span>
      <div id="otp-container">
        <div class="progress-container">
          <svg width="100" height="100">
            <circle cx="50" cy="50" r="40" class="progress-background"></circle>
            <circle
              cx="50"
              cy="50"
              r="40"
              class="progress-circle"
              id="progressCircle"
            ></circle>
          </svg>
        </div>
        <div class="otp-display">
          <span id="otp" onclick="copyOTP()"></span>
        </div>
        <span id="copied">Copied to clipboard</span>
        <br />
        <br />
        <p class="hint">
          🔖 Press <kbd>Ctrl + D</kbd> (or <kbd>Cmd + D</kbd> for MacOS)
          to save as bookmark - works as a shortcut to the OTP
          Authenticator with your key already configured
          <br />
          <br />
          (it's recommended to add the OTP name to the bookmark for easier
          identification).
        </p>
      </div>
    </div>
    <span class="footer">v0.1.2 by oconde.dev</span>
    <script src="script.js"></script>
  </body>
</html>
